<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechFest 2026 | Register</title>
  <link rel="stylesheet" href="css/register.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <a href="index.html" class="logo-link" aria-label="TechFest home">
          <span class="logo">TF</span>
        </a>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html" class="active">Register</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Register for the experience</h1>
        <p>Secure your place in the best of TechFest by filling out the form below.</p>
      </section>

      <section class="form-card">
        <div class="title-section">
          <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
          </svg>
          <p class="title">Register Now</p>
        </div>

        <form class="form" id="registrationForm" novalidate>
          <div class="input-group">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="input-content">
              <label for="fullname">Full Name</label>
              <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />
            </div>
          </div>

          <div class="input-group">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0110 0v4"></path>
              </svg>
            </div>
            <div class="input-content">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="example@domain.com" required />
            </div>
          </div>

          <div class="input-group">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M5 4h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z"></path>
                <path d="M8 8h8"></path>
                <path d="M8 12h8"></path>
                <path d="M8 16h5"></path>
              </svg>
            </div>
            <div class="input-content">
              <label for="phone">Mobile Number</label>
              <input type="tel" id="phone" name="phone" placeholder="10-digit number" pattern="[0-9]{10}" required />
            </div>
          </div>

          <div class="input-group">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <path d="M8 2v4"></path>
                <path d="M16 2v4"></path>
                <path d="M3 10h18"></path>
              </svg>
            </div>
            <div class="input-content">
              <label for="dob">Date of Birth</label>
              <input type="date" id="dob" name="dob" required />
            </div>
          </div>

          <div class="input-group">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 3l7 4v5c0 5-3.5 8.5-7 9-3.5-.5-7-4-7-9V7l7-4z"></path>
              </svg>
            </div>
            <div class="input-content">
              <label>Gender</label>
              <div class="radio-group">
                <label><input type="radio" name="gender" value="male" required /> Male</label>
                <label><input type="radio" name="gender" value="female" /> Female</label>
                <label><input type="radio" name="gender" value="other" /> Other</label>
              </div>
            </div>
          </div>

          <div class="input-group">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 7h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 17h10"></path>
              </svg>
            </div>
            <div class="input-content">
              <label for="dept">Department</label>
              <select id="dept" name="dept" required>
                <option value="">-- Choose Department --</option>
                <option value="cse">Computer Science &amp; Engineering</option>
                <option value="ece">Electronics &amp; Communication</option>
                <option value="eee">Electrical &amp; Electronics</option>
                <option value="mech">Mechanical Engineering</option>
              </select>
            </div>
          </div>

          <div class="input-group">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M5 5h14v14H5z"></path>
                <path d="M8 9h8"></path>
                <path d="M8 13h5"></path>
              </svg>
            </div>
            <div class="input-content">
              <label>Track Events</label>
              <div class="checkbox-group">
                <label><input type="checkbox" name="events" value="hackathon" /> Define 4.0</label>
                <label><input type="checkbox" name="events" value="robowars" /> RoboWars</label>
                <label><input type="checkbox" name="events" value="webdev" /> Web Dev Showdown</label>
              </div>
            </div>
          </div>

          <div class="input-group">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 6h16"></path>
                <path d="M4 12h10"></path>
                <path d="M4 18h16"></path>
              </svg>
            </div>
            <div class="input-content">
              <label for="comments">Message</label>
              <textarea id="comments" name="comments" rows="4" placeholder="Mention hardware setups or dietary requests..."></textarea>
            </div>
          </div>

          <button class="sign" type="submit">
            <span>Submit Application</span>
            <span class="sign-arrow">→</span>
          </button>
        </form>
      </section>

      <section class="participants-card">
        <div class="title-section">
          <p class="title">Registered Participants</p>
        </div>
        <div class="participant-toolbar">
          <p>Total Participants: <span id="participantCount">0</span></p>
          <p id="participantSummary">Total registrations: 0</p>
          <input type="search" id="participantSearch" placeholder="Search participants..." />
          <button type="button" id="clearParticipants">Clear All</button>
        </div>
        <div id="participantList" class="participant-list"></div>
      </section>
    </main>

    <footer></footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
