<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechFest 2026 | Sign Up</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container auth-shell">
      <header class="topbar">
        <div class="brand">
          <a href="index.html" class="logo-link" aria-label="TechFest home">
            <span class="logo">TF</span>
          </a>
        </div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="events.html">Events</a>
          <a href="register.html">Register</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact</a>
        </nav>
      </header>

      <main class="auth-page">
        <section class="auth-card">
          <div class="auth-card__header">
            <p class="eyebrow">Join TechFest</p>
            <h1>Create your account</h1>
            <p>Sign up as a participant and unlock the full festival experience.</p>
          </div>

          <form id="signupForm" class="auth-form" novalidate>
            <label class="auth-field">
              <span>Full Name</span>
              <input type="text" id="signupName" name="name" placeholder="Enter your full name" required />
            </label>
            <label class="auth-field">
              <span>Username</span>
              <input type="text" id="signupUsername" name="username" placeholder="Choose a username" required />
            </label>
            <label class="auth-field">
              <span>Email</span>
              <input type="email" id="signupEmail" name="email" placeholder="Enter your email" required />
            </label>
            <label class="auth-field">
              <span>Password</span>
              <input type="password" id="signupPassword" name="password" placeholder="Choose a password" required />
            </label>
            <label class="auth-field">
              <span>Confirm Password</span>
              <input type="password" id="signupConfirmPassword" name="confirmPassword" placeholder="Re-enter password" required />
            </label>
            <p id="signupFeedback" class="form-feedback" aria-live="polite"></p>
            <button type="submit" class="sign">Create account</button>
          </form>

          <p class="auth-switch">
            Already registered?
            <a href="login.html">Login instead</a>
          </p>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
