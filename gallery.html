<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechFest 2026 | Gallery</title>
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <a href="index.html" class="logo-link" aria-label="TechFest home">
          <span class="logo">TF</span>
        </a>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="gallery-layout">
      <section class="hero">
        <h1>Visual highlights</h1>
        <p>Watch the teaser, listen to the theme track, and revisit last year’s energy.</p>
      </section>

      <section class="media-card">
        <h2>Promotional Trailer</h2>
        <div class="media-video-container">
          <video controls poster="image/event1.jpg">
            <source src="media/Hash.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
        </div>
      </section>

      <section class="media-card gallery-grid-card">
        <h2>Snapshots from Last Year</h2>
        <div class="cards">
          <figure class="card">
            <img src="image/event1.jpg" alt="Hackathon arena full of participants" />
            <figcaption>Hackathon Arena 2025</figcaption>
          </figure>
          <figure class="card">
            <img src="image/event2.jpg" alt="Winners holding trophy on stage" />
            <figcaption>Grand Finale Valedictory</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <a href="register.html" class="floating-btn">Register</a>
    <footer></footer>
  </div>
</body>
</html>
